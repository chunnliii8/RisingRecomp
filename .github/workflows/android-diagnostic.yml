name: Android diagnostic APK

on:
  push:
    branches:
      - risingRecomp
    paths:
      - "android/diagnostic/**"
      - ".github/workflows/android-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Vulkan 1.1 compatibility shaders
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          shader_dir=android/diagnostic/app/build/generated
          mkdir -p "$shader_dir"
          glslangValidator -V --target-env vulkan1.0 -S vert \
            android/diagnostic/app/src/main/shaders/compat.vert -o "$shader_dir/compat.vert.spv"
          glslangValidator -V --target-env vulkan1.0 -S frag \
            android/diagnostic/app/src/main/shaders/compat.frag -o "$shader_dir/compat.frag.spv"
          {
            echo '#pragma once'
            echo '#include <cstdint>'
            echo 'inline constexpr uint32_t kCompatibilityVertexSpv[] = {'
            od -An -v -t x4 "$shader_dir/compat.vert.spv" | awk '{for (i=1;i<=NF;i++) printf "0x%s, ", $i}'
            echo '};'
            echo 'inline constexpr uint32_t kCompatibilityFragmentSpv[] = {'
            od -An -v -t x4 "$shader_dir/compat.frag.spv" | awk '{for (i=1;i<=NF;i++) printf "0x%s, ", $i}'
            echo '};'
          } > "$shader_dir/compat_shaders_spv.h"

      - name: Build ARM64 diagnostic APK
        working-directory: android/diagnostic
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s android/diagnostic/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/diagnostic/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/librising_diagnostic.so'

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: RisingRecomp-Compatibility-Probe-v0.2.0
          path: android/diagnostic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
