plugins {
    id "com.android.application"
}

android {
    namespace "com.risingrecomp.runtime"
    compileSdk 35

    defaultConfig {
        applicationId "com.risingrecomp.runtime"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0-xbla-intake"

        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -Wall -Wextra -Werror"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
